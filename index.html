<script>
    function updateClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondDeg = seconds * 6;
        const minuteDeg = minutes * 6 + seconds * 0.1;
        const hourDeg = (hours % 12) * 30 + minutes * 0.5;

        // Floating Clock
        document.getElementById("second").style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
        document.getElementById("minute").style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
        document.getElementById("hour").style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

        // Background Clock
        document.getElementById("bgSecond").style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
        document.getElementById("bgMinute").style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
        document.getElementById("bgHour").style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    // Scroll detection for floating clock
    let lastScrollTop = 0;
    const floatingClock = document.getElementById("floatingClock");

    window.addEventListener("scroll", function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

        if (scrollTop > lastScrollTop) {
            // Scrolling DOWN
            floatingClock.style.opacity = "0";
            floatingClock.style.pointerEvents = "none";
        } else {
            // Scrolling UP
            floatingClock.style.opacity = "1";
            floatingClock.style.pointerEvents = "auto";
        }

        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });

    setInterval(updateClock, 1000);
    updateClock();
</script>
